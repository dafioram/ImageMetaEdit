name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a new browser release that breaks the app shows up
    # without waiting for someone to push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:static

  browser:
    name: Browser (${{ matrix.browser }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Chromium gates the build. Firefox and WebKit are reported but do not
    # fail the run until they have a clean history here.
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }} and its system libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser tests
        run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
